<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speed test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --page: #e7edf5;
      --card: #f9fafc;
      --text: #142033;
      --muted: #56627a;
      --accent-start: #2a6a4c;
      --accent-end: #3f9152;
      --track: #d5dce8;
      --tile: #f9fafc;
      --tile-border: #d5dce6;
      --border: #e1e7f0;
      --shadow: 0 12px 40px rgba(20, 32, 51, 0.08);
      --button-text: #03110a;
      --focus: #1e4d38;
      --dot: #3f9152;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #070b14;
        --card: #141c2c;
        --text: #f4f7fb;
        --muted: #b7c2d4;
        --accent-start: #2a6a4c;
        --accent-end: #3f9152;
        --track: #2c3a52;
        --tile: #182234;
        --tile-border: #314158;
        --border: #2a3850;
        --shadow: none;
        --button-text: #03110a;
        --focus: #8fd0a8;
        --dot: #4caf6a;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--page);
      color: var(--text);
      font-family: Inter, sans-serif;
    }

    .card {
      width: min(420px, calc(100% - 32px));
      margin: 24px auto;
      padding: 22px 18px 20px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .gauge {
      position: relative;
    }

    .gauge svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .tick {
      fill: var(--muted);
      font-size: 12px;
      font-family: Inter, sans-serif;
      font-weight: 500;
    }

    .readout {
      position: absolute;
      left: 0;
      right: 0;
      top: 46%;
      text-align: center;
      pointer-events: none;
    }

    .readout-value {
      margin: 0;
      font-size: 64px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: -0.045em;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .readout-unit {
      margin: 4px 0 0;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.01em;
      color: var(--muted);
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 4px 0 0;
      font-size: 15px;
      font-weight: 600;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--dot);
      flex: none;
    }

    .dot.live {
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .stages {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 18px;
    }

    .stage {
      min-width: 0;
      padding: 10px 10px 12px;
      border: 1px solid var(--tile-border);
      border-radius: 14px;
      background: var(--tile);
      cursor: default;
    }

    .stage.active {
      border-color: var(--accent-end);
      box-shadow: inset 0 0 0 1px var(--accent-end);
    }

    .stage.upcoming .stage-name {
      color: var(--muted);
    }

    .stage-top {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .stage-name {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
    }

    .check {
      width: 16px;
      height: 16px;
      flex: none;
    }

    .check[hidden] { display: none; }

    .stage-value {
      margin: 8px 0 0;
      min-height: 1.2em;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }

    .stage.upcoming .stage-value { visibility: hidden; }

    .meta {
      margin: 16px 0 0;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .again {
      display: block;
      margin: 16px auto 0;
      border: 0;
      border-radius: 999px;
      padding: 12px 28px;
      background: linear-gradient(90deg, var(--accent-start), var(--accent-end));
      color: var(--button-text);
      font: 600 15px/1 Inter, sans-serif;
      cursor: pointer;
    }

    .again[hidden] { display: none; }

    .again:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 359px) {
      .readout-value { font-size: 44px; }
      .stages { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      .dot.live { animation: none; }
    }
  </style>
</head>
<body>
  <article class="card">
    <div class="gauge">
      <svg viewBox="0 0 400 250" aria-hidden="true">
        <defs>
          <linearGradient id="arc-fill" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="var(--accent-start)"></stop>
            <stop offset="100%" stop-color="var(--accent-end)"></stop>
          </linearGradient>
        </defs>
        <path id="track" fill="none" stroke="var(--track)" stroke-width="14" stroke-linecap="round" pathLength="100"></path>
        <path id="value-arc" fill="none" stroke="url(#arc-fill)" stroke-width="14" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"></path>
        <g id="ticks" class="tick"></g>
      </svg>
      <div
        id="meter"
        class="readout"
        role="meter"
        aria-valuemin="0"
        aria-valuemax="1000"
        aria-valuenow="0"
        aria-valuetext="Measuring latency"
      >
        <p id="readout" class="readout-value">—</p>
        <p class="readout-unit">Mbps</p>
      </div>
    </div>

    <p class="status">
      <span id="dot" class="dot live" aria-hidden="true"></span>
      <span id="status">Testing latency…</span>
    </p>

    <div class="stages">
      <div class="stage active" id="stage-latency">
        <div class="stage-top">
          <svg class="check" id="check-latency" hidden viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="8" fill="var(--accent-end)"></circle>
            <path d="M4.4 8.2 6.8 10.6 11.6 5.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          <span class="stage-name">Latency</span>
        </div>
        <p class="stage-value" id="value-latency"></p>
      </div>
      <div class="stage upcoming" id="stage-download">
        <div class="stage-top">
          <svg class="check" id="check-download" hidden viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="8" fill="var(--accent-end)"></circle>
            <path d="M4.4 8.2 6.8 10.6 11.6 5.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          <span class="stage-name">Download</span>
        </div>
        <p class="stage-value" id="value-download"></p>
      </div>
      <div class="stage upcoming" id="stage-upload">
        <div class="stage-top">
          <svg class="check" id="check-upload" hidden viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="8" fill="var(--accent-end)"></circle>
            <path d="M4.4 8.2 6.8 10.6 11.6 5.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          <span class="stage-name">Upload</span>
        </div>
        <p class="stage-value" id="value-upload"></p>
      </div>
    </div>

    <p id="meta" class="meta">0s elapsed · 0 MB transferred</p>
    <button type="button" class="again" id="again" hidden>Test again</button>
    <div id="live" class="sr-only" aria-live="polite"></div>
  </article>

  <script>
    const GEO = { cx: 200, cy: 208, r: 122 };
    const LOG = Math.log10(1001);
    const PHASES = [
      { id: "latency", ms: 2000, label: "Testing latency…" },
      { id: "download", ms: 4500, label: "Testing download…", final: 112.4 },
      { id: "upload", ms: 4500, label: "Testing upload…", final: 63.3 },
    ];
    const LATENCY_MS = 14;

    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const track = document.getElementById("track");
    const valueArc = document.getElementById("value-arc");
    const ticks = document.getElementById("ticks");
    const meter = document.getElementById("meter");
    const readout = document.getElementById("readout");
    const statusEl = document.getElementById("status");
    const dot = document.getElementById("dot");
    const meta = document.getElementById("meta");
    const again = document.getElementById("again");
    const live = document.getElementById("live");

    const arc = `M ${GEO.cx - GEO.r} ${GEO.cy} A ${GEO.r} ${GEO.r} 0 0 1 ${GEO.cx + GEO.r} ${GEO.cy}`;
    track.setAttribute("d", arc);
    valueArc.setAttribute("d", arc);

    for (const [mbps, label] of [[0, "0"], [10, "10"], [50, "50"], [100, "100"], [500, "500"], [1000, "1k"]]) {
      const p = Math.log10(1 + mbps) / LOG;
      const theta = Math.PI * (1 - p);
      const radius = GEO.r + 28;
      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.setAttribute("x", (GEO.cx + radius * Math.cos(theta)).toFixed(1));
      text.setAttribute("y", (GEO.cy - radius * Math.sin(theta)).toFixed(1));
      text.setAttribute("text-anchor", "middle");
      text.setAttribute("dominant-baseline", "middle");
      text.textContent = label;
      ticks.appendChild(text);
    }

    let run = 0;
    let frame = 0;

    function logProgress(mbps) {
      return Math.log10(1 + Math.max(0, mbps)) / LOG;
    }

    function announce(message) {
      if (live.textContent === message) return;
      live.textContent = message;
    }

    function paintStages(activeId, results) {
      for (const phase of PHASES) {
        const tile = document.getElementById("stage-" + phase.id);
        const done = results[phase.id] != null;
        tile.classList.toggle("active", phase.id === activeId && !done);
        tile.classList.toggle("upcoming", !done && phase.id !== activeId);
        document.getElementById("check-" + phase.id).hidden = !done;
        const value = document.getElementById("value-" + phase.id);
        if (phase.id === "latency" && done) value.textContent = results.latency + " ms";
        else if (done) value.textContent = results[phase.id].toFixed(1) + " Mbps";
        else value.textContent = "";
      }
    }

    function paintReadout(shown, measuringLatency) {
      const mbps = Math.max(0, shown);
      valueArc.style.strokeDashoffset = String(100 * (1 - logProgress(mbps)));
      if (measuringLatency) {
        readout.textContent = "—";
        meter.setAttribute("aria-valuenow", "0");
        meter.setAttribute("aria-valuetext", "Measuring latency");
        return;
      }
      const rounded = mbps.toFixed(1);
      readout.textContent = rounded;
      meter.setAttribute("aria-valuenow", rounded);
      meter.setAttribute("aria-valuetext", rounded + " megabits per second");
    }

    function formatTransferred(megabytes) {
      if (megabytes >= 10) return megabytes.toFixed(1) + " MB";
      if (megabytes >= 1) return megabytes.toFixed(2) + " MB";
      return Math.max(0, megabytes).toFixed(2) + " MB";
    }

    function start() {
      const id = ++run;
      cancelAnimationFrame(frame);
      again.hidden = true;
      const results = {};
      let phaseIndex = 0;
      let phaseStart = performance.now();
      let origin = phaseStart;
      let last = phaseStart;
      let shown = 0;
      let target = 0;
      let megabytes = 0;

      statusEl.textContent = PHASES[0].label;
      dot.classList.add("live");
      paintStages(PHASES[0].id, results);
      announce("Testing latency");
      paintReadout(0, true);
      meta.textContent = "0s elapsed · 0.00 MB transferred";

      const step = (now) => {
        if (id !== run) return;
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        const phase = PHASES[phaseIndex];
        const t = Math.min(1, (now - phaseStart) / phase.ms);

        if (phase.id === "latency") {
          target = 0;
        } else {
          const climb = 1 - (1 - t) ** 2;
          const noise = reduced || t > 0.92 ? 0 : (Math.random() - 0.5) * phase.final * 0.05;
          target = t >= 1 ? phase.final : Math.max(0, phase.final * climb + noise);
          megabytes += Math.max(0, target) * dt / 8;
        }

        const ease = reduced ? 1 : 1 - Math.exp(-dt / 0.16);
        shown += (target - shown) * ease;
        if (Math.abs(shown - target) < 0.04) shown = target;

        paintReadout(shown, phase.id === "latency");
        const elapsed = Math.floor((now - origin) / 1000);
        meta.textContent = elapsed + "s elapsed · " + formatTransferred(megabytes) + " transferred";

        if (t >= 1) {
          if (phase.id === "latency") results.latency = LATENCY_MS;
          else results[phase.id] = phase.final;
          shown = phase.final || 0;
          target = shown;
          phaseIndex += 1;
          if (phaseIndex >= PHASES.length) {
            paintReadout(PHASES[2].final, false);
            paintStages("", results);
            statusEl.textContent = "Test complete";
            dot.classList.remove("live");
            announce("Test complete");
            again.hidden = false;
            return;
          }
          phaseStart = now;
          statusEl.textContent = PHASES[phaseIndex].label;
          paintStages(PHASES[phaseIndex].id, results);
          announce(PHASES[phaseIndex].label.replace("…", ""));
        }
        frame = requestAnimationFrame(step);
      };

      frame = requestAnimationFrame(step);
    }

    again.addEventListener("click", start);
    start();
  </script>
</body>
</html>
