name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:43123
          NEXT_PUBLIC_SPEEDTEST_URL: http://127.0.0.1:18443

  speedtest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/speedtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go test ./...
      - run: go build -o /tmp/speedtest ./cmd/server
