services:
  speedtest:
    build: ./services/speedtest
    ports:
      - "18443:18443"
    env_file:
      - .env
    environment:
      SPEEDTEST_LISTEN_ADDR: ":18443"
      SPEEDTEST_PUBLIC_URL: ${SPEEDTEST_PUBLIC_URL:-http://127.0.0.1:18443}
      SPEEDTEST_SERVER_ID: ${SPEEDTEST_SERVER_ID:-local-1}
      SPEEDTEST_SERVER_NAME: ${SPEEDTEST_SERVER_NAME:-Local Dev}
      SPEEDTEST_SERVER_REGION: ${SPEEDTEST_SERVER_REGION:-local}
      SPEEDTEST_SERVER_LOCATION: ${SPEEDTEST_SERVER_LOCATION:-Development}
      SPEEDTEST_HMAC_SECRET: ${SPEEDTEST_HMAC_SECRET:-dev-hmac-secret-change-in-production}
      SPEEDTEST_ADMIN_TOKEN: ${SPEEDTEST_ADMIN_TOKEN:-dev-admin-token}
      SPEEDTEST_CORS_ORIGINS: ${SPEEDTEST_CORS_ORIGINS:-http://127.0.0.1:43123,http://localhost:43123}
      SPEEDTEST_MAX_CONCURRENT_TESTS: ${SPEEDTEST_MAX_CONCURRENT_TESTS:-50}
      SPEEDTEST_DAILY_BANDWIDTH_GB: ${SPEEDTEST_DAILY_BANDWIDTH_GB:-500}
      SPEEDTEST_PER_TEST_BUDGET_MB_LIGHT: ${SPEEDTEST_PER_TEST_BUDGET_MB_LIGHT:-20}
      SPEEDTEST_PER_TEST_BUDGET_MB_STANDARD: ${SPEEDTEST_PER_TEST_BUDGET_MB_STANDARD:-80}
      SPEEDTEST_MAX_DURATION_SEC: ${SPEEDTEST_MAX_DURATION_SEC:-20}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18443/health"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Optional local Postgres mirroring Supabase schema for development
  db:
    image: postgres:16-alpine
    profiles: ["db"]
    environment:
      POSTGRES_USER: speedcheck
      POSTGRES_PASSWORD: speedcheck
      POSTGRES_DB: speedcheck
    ports:
      - "54322:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speedcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
