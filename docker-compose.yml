services:
  speedtest:
    build: ./services/speedtest
    ports:
      - "18443:18443"
    env_file:
      - .env
    environment:
      # Fixed listen port; all other SPEEDTEST_* come from .env via env_file.
      SPEEDTEST_LISTEN_ADDR: ":18443"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18443/health"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Optional local Postgres mirroring Supabase schema for development
  db:
    image: postgres:16-alpine
    profiles: ["db"]
    environment:
      POSTGRES_USER: speedcheck
      POSTGRES_PASSWORD: speedcheck
      POSTGRES_DB: speedcheck
    ports:
      - "54322:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speedcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
