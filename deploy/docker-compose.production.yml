# Production measurement node — copy to /opt/speedcheck/docker-compose.yml
#
# Prerequisites on the VPS:
#   /opt/speedcheck/.env          (SPEEDTEST_* secrets + server metadata)
#   /opt/speedcheck/services/speedtest/   (Go service + Dockerfile)
#
#   cd /opt/speedcheck
#   docker compose up -d --build speedtest
#   curl -sS http://127.0.0.1:18443/servers

services:
  speedtest:
    build: ./services/speedtest
    ports:
      - "18443:18443"
    env_file:
      - .env
    environment:
      SPEEDTEST_LISTEN_ADDR: ":18443"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18443/health"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped
